<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sealoo</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div id="pet" aria-label="Sealoo"></div>

    <div id="quickbar" class="qb" hidden>
      <form id="qb-prompt" class="qb-prompt qb-shell" autocomplete="off">
        <input
          id="qb-input"
          class="qb-input"
          type="text"
          name="prompt"
          placeholder="跟 Sealoo 说点什么…"
          maxlength="500"
          aria-label="任务输入"
        />
        <button type="submit" class="qb-send" aria-label="发送">
          <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">
            <path
              d="M3 1.5 11 7 3 12.5V9l5-2-5-2V1.5Z"
              fill="currentColor"
            />
          </svg>
        </button>
      </form>

      <div id="qb-panel" class="qb-panel qb-shell" hidden>
        <section id="qb-card" class="qb-card" hidden>
          <p id="qb-prompt-line" class="qb-prompt-line"></p>
          <p id="qb-reply" class="qb-reply" hidden></p>
          <p id="qb-chain" class="qb-chain" hidden></p>
          <div class="qb-row">
            <span id="qb-elapsed" class="qb-elapsed">0s</span>
            <button type="button" id="qb-details" class="qb-details">详情</button>
            <button type="button" id="qb-abort" class="qb-abort">中断</button>
          </div>
        </section>

        <div id="qb-strip" class="qb-strip">
          <span id="qb-pulse" class="qb-pulse" aria-hidden="true"></span>
          <span id="qb-strip-status" class="qb-strip-status" aria-live="polite">搜索中</span>
          <button
            type="button"
            id="qb-toggle"
            class="qb-toggle"
            aria-expanded="false"
            aria-label="展开或收起"
          >
            <svg class="qb-chevron" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true">
              <path
                d="M2.5 4.25 6 7.75 9.5 4.25"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        </div>
      </div>
    </div>

    <nav id="ctx-menu" class="ctx-menu" hidden role="menu" aria-label="Sealoo 菜单">
      <button type="button" role="menuitem" data-action="home">主界面</button>
      <button type="button" role="menuitem" data-action="wallet">钱包</button>
      <button type="button" role="menuitem" data-action="settings">设置</button>
      <button type="button" role="menuitem" data-action="quit">退出</button>
      <p class="ctx-hint">Alt + 拖动转身</p>
    </nav>
  </body>
</html>
