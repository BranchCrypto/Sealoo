<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sealoo Quickbar Demo</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <style>
      html,
      body {
        background:
          radial-gradient(90% 70% at 50% 0%, #7eb6ff 0%, transparent 55%),
          linear-gradient(180deg, #2a4a66 0%, #0d1824 100%);
      }
      #pet {
        display: grid;
        place-items: end center;
        padding-bottom: 28px;
      }
      #pet-hit {
        width: 140px;
        height: 140px;
        border-radius: 50% 50% 46% 46%;
        background: linear-gradient(180deg, #9eb4c4, #5a6b76);
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
        cursor: pointer;
      }
      .hint {
        position: fixed;
        left: 12px;
        bottom: 12px;
        color: rgba(255, 255, 255, 0.7);
        font: 12px/1.4 "Segoe UI", "PingFang SC", sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="pet" aria-label="Sealoo">
      <div id="pet-hit" title="单击海豹"></div>
    </div>

    <div id="quickbar" class="qb" hidden>
      <form id="qb-prompt" class="qb-prompt qb-shell" autocomplete="off">
        <input
          id="qb-input"
          class="qb-input"
          type="text"
          name="prompt"
          placeholder="跟 Sealoo 说点什么…"
          maxlength="500"
          aria-label="任务输入"
        />
        <button type="submit" class="qb-send" aria-label="发送">
          <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">
            <path d="M3 1.5 11 7 3 12.5V9l5-2-5-2V1.5Z" fill="currentColor" />
          </svg>
        </button>
      </form>

      <div id="qb-panel" class="qb-panel qb-shell" hidden>
        <section id="qb-card" class="qb-card" hidden>
          <p id="qb-prompt-line" class="qb-prompt-line"></p>
          <p id="qb-reply" class="qb-reply" hidden></p>
          <div class="qb-row">
            <span id="qb-elapsed" class="qb-elapsed">0s</span>
            <button type="button" id="qb-details" class="qb-details">详情</button>
            <button type="button" id="qb-abort" class="qb-abort">中断</button>
          </div>
        </section>

        <div id="qb-strip" class="qb-strip">
          <span id="qb-pulse" class="qb-pulse" aria-hidden="true"></span>
          <span id="qb-strip-status" class="qb-strip-status" aria-live="polite">搜索中</span>
          <button
            type="button"
            id="qb-toggle"
            class="qb-toggle"
            aria-expanded="false"
            aria-label="展开或收起"
          >
            <svg class="qb-chevron" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true">
              <path
                d="M2.5 4.25 6 7.75 9.5 4.25"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        </div>
      </div>
    </div>

    <p class="hint">单击海豹 → 输入任务；运行中再点 → 强调快捷栏。</p>
    <script type="module" src="/src/qb-demo.ts"></script>
  </body>
</html>
